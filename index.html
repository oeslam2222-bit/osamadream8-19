<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy: the app ships no inline scripts, so anything trying
      to inject code through the DOM or a stored value has nowhere to run.
      'unsafe-inline' stays for styles only, because React and Tailwind set
      element styles at runtime.

      No frame-ancestors here on purpose: browsers ignore that directive when it
      arrives in a <meta> tag (Chrome logs "directive 'frame-ancestors' is ignored
      when delivered via a <meta> element"), so it was never actually protecting
      anything — it was only producing a warning. Real clickjacking protection has
      to be an HTTP response header set by the host:
        Content-Security-Policy: frame-ancestors 'none'
        X-Frame-Options: DENY
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' data: https://fonts.gstatic.com;
               img-src 'self' data: blob: https:;
               connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.googleapis.com https://docs.google.com https://drive.google.com https://*.cloudinary.com https://res.cloudinary.com https://*.powerplatform.com;
               worker-src 'self' blob:;
               object-src 'none';
               base-uri 'self';
               form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>مجموعة الطنطاوي للتجارة والتوزيع | TANTAWY GROUP</title>

    <meta property="og:title" content="مجموعة الطنطاوي للتجارة والتوزيع | TANTAWY GROUP" />

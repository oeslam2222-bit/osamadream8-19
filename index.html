<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>مجموعة الطنطاوي للتجارة والتوزيع | TANTAWY GROUP</title>
    <meta name="description" content="منظومة متكاملة لمجموعة الطنطاوي للتجارة والتوزيع: عرض الكتالوج مع ضغط صور جوجل درايف وتوفير الباقة، إدارة المخزون ومنع الحجز المزدوج للمناديب، دورة اعتماد وصرف الطلبيات من المشرف ومدير الفرع، إنشاء فواتير إلكترونية، وتصدير إكسل وتثبيت التطبيق على الموبايل." />
    <link rel="icon" type="image/svg+xml" href="/tantawy-brand-logo.svg?v=3.1" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3.1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3.1" />
    <link rel="manifest" href="/manifest.json?v=3.1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مجموعة الطنطاوي - TANTAWY GROUP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 font-['Cairo',sans-serif] antialiased selection:bg-amber-500 selection:text-white min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; font-family: 'Cairo', system-ui, -apple-system, sans-serif; text-align: center; padding: 20px;">
        <div style="width: 96px; height: 96px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5); margin-bottom: 20px; animation: pulse 2s infinite; overflow: hidden; padding: 4px; border: 3px solid #f59e0b;">
          <img src="/tantawy-brand-logo.svg?v=3.1" alt="مجموعة الطنطاوي" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
        <h2 style="font-size: 20px; font-weight: 900; margin: 0 0 8px 0; color: #fbbf24; letter-spacing: -0.5px;">مجموعة الطنطاوي | TANTAWY GROUP</h2>
        <p style="font-size: 13px; color: #94a3b8; margin: 0 0 24px 0; font-weight: 600;">جاري تحميل منظومة المبيعات والكتالوج والمخازن...</p>
        <div style="width: 160px; height: 4px; background: #1e293b; border-radius: 999px; overflow: hidden;">
          <div style="width: 100%; height: 100%; background: linear-gradient(90deg, transparent, #fbbf24, transparent); animation: loading 1.5s infinite linear;"></div>
        </div>
        <style>
          @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
          }
          @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clear legacy cache storage keys
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(key) {
            if (key.indexOf('dream-tantawy') !== -1 || key.indexOf('v1') !== -1 || key.indexOf('v2') !== -1) {
              caches.delete(key);
            }
          });
        });
      }
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?v=3.1').then(function(reg) {
            reg.update();
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background with rounded corners for app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Geometric Luxury Shield -->
  <path d="M256 64 L390 120 V250 C390 340 330 405 256 440 C182 405 122 340 122 250 V120 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#goldGlow)"/>

  <!-- Inner Decorative Wings / Crown Arc -->
  <path d="M190 170 C230 145 282 145 322 170" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Luxury Star/Diamond Crown Crest -->
  <polygon points="256,115 264,135 284,138 268,150 273,170 256,158 239,170 244,150 228,138 248,135" fill="url(#goldGrad)"/>

  <!-- Monogram "D" in Luxury Serif styling -->
  <text x="256" y="295" font-family="'Times New Roman', 'Cairo', serif" font-weight="900" font-size="140" 
        text-anchor="middle" fill="url(#goldGrad)" filter="url(#goldGlow)">D</text>

  <!-- Arabic Typography: دريم طنطاوي -->
  <text x="256" y="360" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="28" 
        text-anchor="middle" fill="#ffffff" letter-spacing="1">دريـــم طنطـــاوي</text>
  
  <!-- English Subtitle: DREAM TANTAWY -->
  <text x="256" y="388" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" 
        text-anchor="middle" fill="#fbbf24" letter-spacing="3">DREAM TANTAWY</text>

  <!-- Small Stars on bottom -->
  <circle cx="216" cy="410" r="3" fill="#f59e0b"/>
  <circle cx="256" cy="412" r="4.5" fill="#fef08a"/>
  <circle cx="296" cy="410" r="3" fill="#f59e0b"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Slate Teal Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b38" />
      <stop offset="100%" stop-color="#081a23" />
    </linearGradient>

    <!-- Vibrant Teal Leaf Gradients -->
    <linearGradient id="tealGradCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#009488" />
    </linearGradient>

    <linearGradient id="tealGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <linearGradient id="tealGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#009488" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Rounded Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGradient)" stroke="#1e4e64" stroke-width="4" />

  <!-- Tantawy Sprout / 3-Leaf Emblem -->
  <g filter="url(#glow)" transform="translate(0, -10)">
    <!-- Center Leaf (Tallest) -->
    <path d="M 256 95 C 275 140, 290 195, 274 245 C 265 270, 247 270, 238 245 C 222 195, 237 140, 256 95 Z" fill="url(#tealGradCenter)" />

    <!-- Left Leaf (Curved) -->
    <path d="M 240 255 C 200 250, 140 220, 125 155 C 175 145, 220 185, 240 230 Z" fill="url(#tealGradLeft)" />

    <!-- Right Leaf (Curved) -->
    <path d="M 272 255 C 312 250, 372 220, 387 155 C 337 145, 292 185, 272 230 Z" fill="url(#tealGradRight)" />

    <!-- Base Stem Node / Sprout Base -->
    <ellipse cx="256" cy="272" rx="16" ry="12" fill="#2dd4bf" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="375" 
        font-family="'Cairo', 'Tajawal', system-ui, sans-serif" 
        font-size="46" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="-1px">طنطاوي جروب</text>

  <text x="256" y="425" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="22" 
        font-weight="800" 
        fill="#2dd4bf" 
        text-anchor="middle"
        letter-spacing="4px">TANTAWY GROUP</text>
</svg>

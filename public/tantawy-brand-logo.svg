<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Soft background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>

    <!-- Center Circle Shadow -->
    <filter id="centerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Outer Frame Subtle Shadow -->
    <filter id="outerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Clip path for circular ring -->
    <clipPath id="circleClip">
      <circle cx="300" cy="300" r="290" />
    </clipPath>
  </defs>

  <!-- Main Background Container Circle -->
  <circle cx="300" cy="300" r="292" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="4" filter="url(#outerShadow)" />

  <!-- Outer Ring Section Dividers & Backgrounds -->
  <g clip-path="url(#circleClip)">
    <!-- Subtle top segment arc tint -->
    <path d="M 10 300 A 290 290 0 0 1 590 300 Z" fill="#f8fafc" opacity="0.6" />
    
    <!-- Top & Bottom Header Category Titles -->
    <!-- Top: HOME APPLIANCES BRANDS -->
    <text x="300" y="68" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="14" 
          letter-spacing="1.5" 
          fill="#1e3a8a" 
          text-anchor="middle">HOME APPLIANCES BRANDS</text>

    <!-- Bottom: HOMEWARE BRANDS -->
    <text x="300" y="578" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="14" 
          letter-spacing="1.5" 
          fill="#1e3a8a" 
          text-anchor="middle">HOMEWARE BRANDS</text>

    <!-- TOP SECTION: APPLIANCES BRANDS -->
    <!-- 1. PHILIPS (Center Top) -->
    <text x="300" y="106" 
          font-family="system-ui, -apple-system, 'Segoe UI', Impact, sans-serif" 
          font-weight="900" 
          font-size="24" 
          letter-spacing="2" 
          fill="#0066cc" 
          text-anchor="middle">PHILIPS</text>

    <!-- 2. TROMMA (Top Left) -->
    <g transform="translate(175, 126)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="1" fill="#dc2626" text-anchor="middle">TROMMA</text>
      <text x="0" y="8" font-family="system-ui, sans-serif" font-weight="700" font-size="6" letter-spacing="1.5" fill="#475569" text-anchor="middle">HOME APPLIANCES</text>
    </g>

    <!-- 3. Ariete (Top Right) -->
    <g transform="translate(430, 126)">
      <text x="0" y="0" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-style="italic" font-weight="bold" font-size="20" fill="#dc2626" text-anchor="middle">Ariete</text>
      <text x="0" y="8" font-family="system-ui, sans-serif" font-weight="600" font-size="5.5" letter-spacing="0.5" fill="#64748b" text-anchor="middle">It's Genius of the House</text>
    </g>

    <!-- 4. ARSHIA (Upper Left) -->
    <g transform="translate(120, 180)">
      <circle cx="-38" cy="-3" r="4" fill="none" stroke="#0284c7" stroke-width="1.5" />
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="15" letter-spacing="1.5" fill="#0369a1" text-anchor="middle">ARSHIA</text>
    </g>

    <!-- 5. dream (Upper Right) -->
    <g transform="translate(500, 186)">
      <!-- Dream 3-bar logo -->
      <g transform="translate(-48, -12)">
        <rect x="0" y="0" width="12" height="3" rx="1.5" fill="#0d9488" />
        <rect x="0" y="5" width="10" height="3" rx="1.5" fill="#0d9488" />
        <rect x="0" y="10" width="12" height="3" rx="1.5" fill="#0d9488" />
      </g>
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#0f766e" text-anchor="middle">dream</text>
    </g>

    <!-- MID/LOWER SECTION: HOMEWARE BRANDS -->
    <!-- 6. Lines (Mid Left) -->
    <g transform="translate(78, 260)">
      <circle cx="-24" cy="-10" r="3" fill="#ea580c" />
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#1e293b" text-anchor="middle">lines</text>
    </g>

    <!-- 7. Gigilli (Mid Right) -->
    <text x="530" y="260" font-family="system-ui, sans-serif" font-weight="800" font-size="17" fill="#64748b" text-anchor="middle">Gigilli</text>

    <!-- 8. Luminarc (Lower Left 1) -->
    <text x="80" y="310" font-family="system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="0.5" fill="#1e293b" text-anchor="middle">Luminarc</text>

    <!-- 9. GEMYA (Lower Right 1) -->
    <g transform="translate(530, 310)">
      <rect x="-35" y="-14" width="70" height="20" rx="4" fill="#312e81" />
      <text x="0" y="1" font-family="system-ui, sans-serif" font-weight="900" font-size="12" letter-spacing="1" fill="#ffffff" text-anchor="middle">GEMYA</text>
    </g>

    <!-- 10. ALZA (Lower Left 2) -->
    <g transform="translate(80, 358)">
      <rect x="-34" y="-13" width="68" height="22" rx="2" fill="#dc2626" stroke="#0f172a" stroke-width="1.5" />
      <text x="0" y="2" font-family="system-ui, sans-serif" font-weight="900" font-size="13" letter-spacing="1.5" fill="#ffffff" text-anchor="middle">ALZA</text>
    </g>

    <!-- 11. Kazan (Lower Right 2) -->
    <g transform="translate(520, 358)">
      <text x="0" y="0" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-size="17" font-weight="bold" fill="#d97706" text-anchor="middle">kazan</text>
    </g>

    <!-- 12. BLINK MAX (Lower Left 3) -->
    <g transform="translate(105, 408)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="12" letter-spacing="0.5" fill="#dc2626" text-anchor="middle">BLINK MAX</text>
    </g>

    <!-- 13. dream (Lower Right 3) -->
    <g transform="translate(510, 408)">
      <g transform="translate(-40, -10)">
        <rect x="0" y="0" width="10" height="2.5" rx="1" fill="#0d9488" />
        <rect x="0" y="4" width="8" height="2.5" rx="1" fill="#0d9488" />
        <rect x="0" y="8" width="10" height="2.5" rx="1" fill="#0d9488" />
      </g>
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="15" fill="#0f766e" text-anchor="middle">dream</text>
    </g>

    <!-- 14. Tessie & Jessie (Bottom Left) -->
    <text x="145" y="460" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="14" fill="#334155" text-anchor="middle">Tessie &amp; Jessie</text>

    <!-- 15. casasunco (Bottom Right) -->
    <g transform="translate(470, 460)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="15" letter-spacing="0.5" fill="#334155" text-anchor="middle">casasunco</text>
      <text x="0" y="8" font-family="system-ui, sans-serif" font-weight="600" font-size="6" letter-spacing="2" fill="#64748b" text-anchor="middle">kitchenware</text>
    </g>

    <!-- 16. LOTUS PORCELAIN (Bottom Left Mid) -->
    <g transform="translate(185, 508)">
      <text x="0" y="0" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="14" letter-spacing="1" fill="#334155" text-anchor="middle">LOTUS</text>
      <text x="0" y="8" font-family="system-ui, sans-serif" font-weight="700" font-size="5.5" letter-spacing="1.5" fill="#64748b" text-anchor="middle">PORCELAIN</text>
    </g>

    <!-- 17. FM FATHY MAHMOUD (Bottom Right Mid) -->
    <g transform="translate(425, 508)">
      <text x="-32" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#1e293b">FM</text>
      <text x="6" y="-3" font-family="system-ui, sans-serif" font-weight="800" font-size="8" letter-spacing="0.5" fill="#1e293b">FATHY MAHMOUD</text>
      <text x="6" y="5" font-family="system-ui, sans-serif" font-weight="600" font-size="5" letter-spacing="0.5" fill="#64748b">FINE EGYPTIAN TABLEWARE</text>
    </g>

    <!-- 18. O'lala DESIGN (Bottom Center) -->
    <g transform="translate(300, 530)">
      <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="bold" font-size="18" fill="#1e293b" text-anchor="middle">O'lala</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-weight="700" font-size="6" letter-spacing="2" fill="#64748b" text-anchor="middle">DESIGN</text>
    </g>
  </g>

  <!-- CENTER CIRCLE MEDALLION (Tantawy Group) -->
  <g filter="url(#centerShadow)">
    <circle cx="300" cy="300" r="148" fill="#ffffff" stroke="#f1f5f9" stroke-width="2" />
    <circle cx="300" cy="300" r="147" fill="none" stroke="#e2e8f0" stroke-width="1" />
  </g>

  <!-- CENTER LOGO: Stylized 'T' Monogram -->
  <g transform="translate(300, 240)">
    <!-- Red Left Curve with 'TM' -->
    <path d="M -18 -26 
             C -2 -26, 0 -24, 0 -10
             C 0 0, -4 14, -18 14 
             L -18 0 
             C -9 0, -6 -5, -6 -10 
             C -6 -15, -9 -17, -18 -17 Z" 
          fill="#dc2626" />
    <text x="-21" y="-19" font-family="system-ui, sans-serif" font-size="5.5" font-weight="900" fill="#dc2626" text-anchor="end">TM</text>

    <!-- Dark Blue 'T' Stem and Right Arm -->
    <path d="M 0 -26 
             L 36 -26 
             C 38 -26, 39 -25, 39 -23
             L 39 -13
             C 39 -11, 38 -10, 36 -10
             L 20 -10 
             L 20 18
             C 20 20, 19 21, 17 21
             L 3 21
             C 1 21, 0 20, 0 18
             Z" 
          fill="#1e3a8a" />
    
    <!-- Red Accent at the bottom of the Blue stem -->
    <rect x="3" y="10" width="17" height="11" rx="1" fill="#dc2626" />
  </g>

  <!-- TANTAWY GROUP BRANDING -->
  <text x="300" y="322" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="34" 
        letter-spacing="2.5" 
        fill="#1e3a8a" 
        text-anchor="middle">TANTAWY</text>

  <text x="300" y="348" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="18" 
        letter-spacing="6" 
        fill="#1e3a8a" 
        text-anchor="middle">GROUP</text>

  <!-- By Farouk Tantawy (Signature Script) -->
  <g transform="translate(300, 375)">
    <text x="-48" y="-2" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#1e293b">BY</text>
    <text x="6" y="0" font-family="'Brush Script MT', 'Segoe Script', 'Great Vibes', 'Caveat', cursive, sans-serif" font-style="italic" font-weight="bold" font-size="16" fill="#0f172a" text-anchor="middle">Farouk Tantawy</text>
  </g>

</svg>

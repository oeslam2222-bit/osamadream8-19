<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Radial Sheen for 3D Luster -->
    <radialGradient id="goldSheen" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </radialGradient>

    <!-- Deep Drop Shadow -->
    <filter id="emblemShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350f" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <!-- Letter Inset Depth Shadow -->
    <filter id="letterShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="-2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#goldGradient)" filter="url(#emblemShadow)" />
  
  <!-- Metallic Luster Overlay -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#goldSheen)" />

  <!-- Subtle Inset Gold Border -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="#fef9c3" stroke-width="4" stroke-opacity="0.6" />
  <rect x="38" y="38" width="436" height="436" rx="106" fill="none" stroke="#78350f" stroke-width="2" stroke-opacity="0.25" />

  <!-- Iconic Bold Arabic Letter "ط" (Tantawy Emblem) -->
  <g filter="url(#letterShadow)" fill="#0f172a">
    <!-- Stylized, elegant, perfectly balanced "ط" glyph -->
    <text x="256" y="345" 
          font-family="'Cairo', 'Tajawal', 'IBM Plex Sans Arabic', 'Arial Black', sans-serif" 
          font-size="285" 
          font-weight="900" 
          text-anchor="middle"
          letter-spacing="-2px">ط</text>
  </g>

  <!-- Elegant Brand Kicker Arc / Base Dots -->
  <circle cx="216" cy="415" r="5" fill="#78350f" opacity="0.6" />
  <circle cx="256" cy="415" r="6" fill="#0f172a" />
  <circle cx="296" cy="415" r="5" fill="#78350f" opacity="0.6" />

  <!-- Subtle Micro Label -->
  <text x="256" y="445" 
        font-family="'Cairo', system-ui, sans-serif" 
        font-size="16" 
        font-weight="800" 
        fill="#451a03" 
        letter-spacing="5px" 
        text-anchor="middle"
        opacity="0.85">TANTAWY</text>
</svg>
